<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Snippet</title>
    <link rel="stylesheet" href="./snippet_styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="snippet-container {{CONTAINER_CLASS}} flex items-stretch justify-stretch relative w-fit h-fit overflow-hidden p-0 m-0"
        data-theme="{{THEME}}">
        <div
            class="snippet-window w-full flex-1 min-w-0 flex flex-col overflow-hidden bg-gray-900/90 backdrop-blur-xl border border-white/10 shadow-2xl rounded-lg">
            <!-- Window Controls -->
            <div
                class="window-header grid grid-cols-6 gap-3 items-center px-4 py-3 bg-transparent border-b border-white/5">
                <div class="traffic-lights flex gap-2 col-span-1">
                    <span class="light close w-3 h-3 rounded-full bg-red-500 shadow-sm"></span>
                    <span class="light minimize w-3 h-3 rounded-full bg-yellow-400 shadow-sm"></span>
                    <span class="light maximize w-3 h-3 rounded-full bg-green-500 shadow-sm"></span>
                </div>
                <div
                    class="snippet-title col-span-4 flex justify-center text-gray-400 text-sm font-medium tracking-wide font-sans">
                    {{TITLE}}
                </div>
            </div>

            <!-- Code Content -->
            <div class="code-wrapper p-6 overflow-auto bg-transparent">
                <pre><code class="language-{{LANGUAGE}} text-sm leading-relaxed text-white">{{CODE}}</code></pre>
            </div>
        </div>
    </div>


</body>

</html>
