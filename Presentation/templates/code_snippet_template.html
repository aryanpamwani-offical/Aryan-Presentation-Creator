<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Snippet</title>
    <link rel="stylesheet" href="./snippet_styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="snippet-container {{CONTAINER_CLASS}} flex items-stretch justify-start relative w-fit h-fit overflow-hidden p-0 m-0"
        data-theme="{{THEME}}">
        <div class="snippet-window w-full flex-1 min-w-0 flex flex-col overflow-hidden bg-gray-900/90 rounded-lg">
            <!-- Window Controls -->
            <div class="window-header">
                <div class="traffic-lights">
                    <span class="light close w-3 h-3 rounded-full bg-red-500 shadow-sm"></span>
                    <span class="light minimize w-3 h-3 rounded-full bg-yellow-400 shadow-sm"></span>
                    <span class="light maximize w-3 h-3 rounded-full bg-green-500 shadow-sm"></span>
                </div>
                <div class="snippet-title">
                    {{TITLE}}
                </div>
                <div class="header-spacer" style="width: 60px; display: flex;"></div>
            </div>

            <!-- Code Content -->
            <div class="code-wrapper p-6 overflow-auto bg-transparent">
                <pre><code class="language-{{LANGUAGE}} text-sm leading-relaxed text-white">{{CODE}}</code></pre>
            </div>
        </div>
    </div>


</body>

</html>
